services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      toutim:
        condition: service_healthy
    restart: unless-stopped

  toutim:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"  # Internal only, not published to host
    volumes:
      - toutim-data:/data
    environment:
      - TOUTIM_DATA_DIR=/data
      - TOUTIM_JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - TOUTIM_PORT=8080
      - TOUTIM_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  toutim-data:
  caddy-data:     # Certificats Let's Encrypt
  caddy-config:
