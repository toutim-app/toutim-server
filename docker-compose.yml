services:
  toutim:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - TOUTIM_DATA_DIR=/data
      - TOUTIM_JWT_SECRET=${TOUTIM_JWT_SECRET:?TOUTIM_JWT_SECRET must be set}
      - TOUTIM_PORT=8080
      - TOUTIM_HOST=0.0.0.0
      - TOUTIM_SMTP_HOST=${TOUTIM_SMTP_HOST}
      - TOUTIM_SMTP_PORT=${TOUTIM_SMTP_PORT}
      - TOUTIM_SMTP_USERNAME=${TOUTIM_SMTP_USERNAME}
      - TOUTIM_SMTP_PASSWORD=${TOUTIM_SMTP_PASSWORD}
      - TOUTIM_SMTP_FROM_ADDRESS=${TOUTIM_SMTP_FROM_ADDRESS}
      - TOUTIM_SMTP_FROM_NAME=${TOUTIM_SMTP_FROM_NAME}
      - TOUTIM_SMTP_USE_TLS=${TOUTIM_SMTP_USE_TLS}
      - TOUTIM_SMTP_BASE_URL=${TOUTIM_SMTP_BASE_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
